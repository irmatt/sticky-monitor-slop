name: Release

# Tagging is the release trigger: `git tag v1.1.1 && git push origin v1.1.1`
# Builds the self-contained app, the Inno Setup installer and a portable zip, then attaches
# them to a GitHub release together with checksums.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            # manual run: unique, and still a valid version for the installer
            $version = "0.0.${{ github.run_number }}"
          }

          # Inno Setup's VersionInfoVersion only accepts 2-4 numeric parts, so a tag like
          # v1.2.0-beta1 keeps its label in the file name but stamps a numeric version.
          $numeric = ($version -split '-')[0]
          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') { $numeric = '0.0.0' }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION_NUMERIC=$numeric" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version: $version (numeric: $numeric)"

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish src/StickyMonitor.App/StickyMonitor.App.csproj `
            -c Release -r win-x64 --self-contained true -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$env:VERSION_NUMERIC" installer\StickyMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app/* `
            -DestinationPath "packages/StickyMonitor-Portable-$env:VERSION.zip" -Force

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            "packages/StickyMonitor-Setup-$env:VERSION.exe",
            "packages/StickyMonitor-Portable-$env:VERSION.zip"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath packages/SHA256SUMS.txt -Encoding utf8
          Get-Content packages/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sticky-monitor-${{ env.VERSION }}
          path: |
            packages/StickyMonitor-Setup-*.exe
            packages/StickyMonitor-Portable-*.zip
            packages/SHA256SUMS.txt

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "packages/StickyMonitor-Setup-$env:VERSION.exe"
            "packages/StickyMonitor-Portable-$env:VERSION.zip"
            "packages/SHA256SUMS.txt"
          )

          # A release created through the API (or a re-run) also pushes the tag, so the run that
          # the tag triggers fires when the release already exists. Upload to it instead of failing.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists - uploading assets"
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag --title "Sticky Monitor $tag" --generate-notes @files
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
